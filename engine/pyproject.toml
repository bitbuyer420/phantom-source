[project]
name = "phantom-engine"
version = "0.1.0"
description = "Phantom — desktop GPS location controller for USB-tethered iPhones (macOS). Engine backend."
readme = "README.md"
# iOS 18.2+/26 forces the TCP RemoteXPC tunnel, which needs ssl.set_psk_client_callback (Python 3.13+)
# and an OpenSSL-based interpreter (not macOS LibreSSL).
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=9.36.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
phantom = "phantom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phantom"]
